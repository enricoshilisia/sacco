<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Inuka West Empowerment Group - savings, loans, welfare and meetings.">
  <meta name="theme-color" content="#D62C2C">

  <!-- Added to the Home screen on iPhone it opens like the app, with no browser bars. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inuka West">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Inuka West</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The same sunrise the app opens with, so the first paint matches. */
    html, body { height: 100%; margin: 0; background: #FFF6EE; }
    @media (prefers-color-scheme: dark) { html, body { background: #17120F; } }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #FFF6EE 0%, #FFE6D2 55%, #FFD2C2 100%);
    }
    @media (prefers-color-scheme: dark) {
      #boot { background: linear-gradient(160deg, #17120F 0%, #2A1B16 55%, #3A201B 100%); }
    }
    #boot img { width: 120px; height: 120px; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .65; transform: scale(.96); } }
  </style>
</head>
<body>
  <div id="boot"><img src="icons/Icon-512.png" alt="Inuka West"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
